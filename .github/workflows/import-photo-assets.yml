name: Import Chilcomb photo assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when assets are already imported
        id: check
        run: |
          if [ -f public/images/.imported ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.done != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        if: steps.check.outputs.done != 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download photo bundle
        if: steps.check.outputs.done != 'true'
        env:
          SHARE_URL: https://firestorage.ai/ja/f/I_josvEliu_P
        run: |
          cat > /tmp/download-assets.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({acceptDownloads:true});
            const page = await context.newPage();

            await page.goto(process.env.SHARE_URL, {waitUntil:'domcontentloaded', timeout:90000});
            await page.waitForTimeout(4000);

            const cookieWords = /accept|agree|同意|許可|すべて許可/i;
            const controls = page.locator('button, a');
            for (let i = 0; i < Math.min(await controls.count(), 100); i++) {
              const el = controls.nth(i);
              const text = ((await el.innerText().catch(()=>'')) || '').trim();
              if (cookieWords.test(text)) {
                await el.click({timeout:3000}).catch(()=>{});
                await page.waitForTimeout(1000);
                break;
              }
            }

            let candidates = [];
            const count = await controls.count();
            for (let i = 0; i < Math.min(count, 200); i++) {
              const el = controls.nth(i);
              const text = ((await el.innerText().catch(()=>'')) || '').trim();
              const href = await el.getAttribute('href').catch(()=>null);
              if (/download|ダウンロード|保存/i.test(text) || /download/i.test(href || '')) {
                candidates.push({i,text,href});
              }
            }
            console.log('Download candidates:', JSON.stringify(candidates));

            if (!candidates.length) {
              console.log('Page text:', (await page.locator('body').innerText()).slice(0,12000));
              throw new Error('No download control found');
            }

            let saved = false;
            for (const c of candidates) {
              const el = controls.nth(c.i);
              try {
                const downloadPromise = page.waitForEvent('download', {timeout:15000});
                await el.click({timeout:5000});
                const download = await downloadPromise;
                await download.saveAs('/tmp/chilcomb-photo-assets.zip');
                console.log('Saved download:', await download.suggestedFilename());
                saved = true;
                break;
              } catch (e) {
                console.log('Candidate failed:', c.text, String(e));
                await page.goBack({waitUntil:'domcontentloaded', timeout:15000}).catch(()=>{});
              }
            }

            await browser.close();
            if (!saved || !fs.existsSync('/tmp/chilcomb-photo-assets.zip')) {
              throw new Error('Could not capture the photo bundle download');
            }
          })();
          NODE
          node /tmp/download-assets.cjs

      - name: Install assets
        if: steps.check.outputs.done != 'true'
        run: |
          mkdir -p public/images
          unzip -o /tmp/chilcomb-photo-assets.zip -d public/images
          touch public/images/.imported
          ls -lah public/images

      - name: Commit photo assets
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Add authentic Chilcomb photography"
          git push
